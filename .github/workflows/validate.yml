name: Validate

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    # GitHub-hosted, not the org Mac: this repository is public, so a pull
    # request from a fork runs here, and a fork's code must never run on our own
    # machine. It is also the required check, so it cannot wait on the Mac being
    # online. (A public repository's hosted minutes are free.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Claude Code
        # Pinned so a new Claude Code release cannot change what passes; bump it
        # deliberately.
        run: npm install -g @anthropic-ai/claude-code@2.1.292
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the PurpleGrain plugin
        run: claude plugin validate ./purplegrain
      - name: Check the skill catalogue
        run: python3 scripts/check-skills.py
      - name: Build skill zips
        run: bash scripts/build-skill-zips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: [self-hosted, purplegrain-runner]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zips
        run: bash scripts/build-skill-zips.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
