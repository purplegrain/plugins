name: Validate

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    # Node is installed by setup-node; bash and zip are already on the Mac.
    # Org runner purplegrain-openclaw (id 47) did not take a bare
    # `self-hosted` label or its name alone.
    runs-on: [self-hosted, purplegrain-openclaw]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the PurpleGrain plugin
        run: claude plugin validate ./purplegrain
      - name: Build skill zips
        run: bash scripts/build-skill-zips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: [self-hosted, purplegrain-openclaw]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zips
        run: bash scripts/build-skill-zips.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
